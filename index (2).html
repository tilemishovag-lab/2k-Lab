<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="card">
    <h2>Авторизация</h2>
    <p class="subtitle">Введите логин и пароль</p>

    <form id="authForm">
      <input
        type="text"
        id="login"
        placeholder="Логин"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Пароль"
        required
      >

      <button type="submit">Войти</button>
    </form>

    <p id="result"></p>
  </div>

  <script src="index.js"></script>
</body>
</html>
